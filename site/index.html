<title>App Design 워크플로우</title>
<link rel="preload" href="fonts/PretendardVariable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='7' y='7' width='18' height='18' fill='%23ff3b40' transform='rotate(45 16 16)'/%3E%3C/svg%3E">
<style>
@font-face {
  font-family: "Pretendard Variable";
  src: url("fonts/PretendardVariable.woff2") format("woff2-variations"), url("fonts/PretendardVariable.woff2") format("woff2");
  font-weight: 45 920; font-style: normal; font-display: swap;
}
/* 레이아웃: 상단 바 → 히어로가 그대로 이어지는 가로 레인 다이어그램(+상세 패널) → 데이터 점검.
   랜딩페이지 가이드와 같은 라이트 단일 테마 · Pretendard 한 서체 · 메인 컬러 하나 + 회색 단계 */
:root {
  color-scheme: light;
  --brand: #ff3b40; --brand-ink: #ffffff;
  --bg-white: #ffffff; --bg-gray: #f5f5f7; --bg-near: #fafafc;
  --text: #1d1d1f; --text-2: #6e6e73; --text-3: #8e8e93;
  --line: #d2d2d7;
  --shape-light: #f0f0f3; --shape-gray: #e5e5ea; --shape-mid: #d2d2d7;
  --trace-1: #c7c7cc; --trace-2: #aeaeb2; --pat-circle: #e8e8ed;
  --bubble: #1d1d1f;
  --nav-h: 52px; --gutter: 16px; --max: 1280px;
  --ease: cubic-bezier(.2, .7, .2, 1);
  --ease-out: cubic-bezier(.16, 1, .3, 1);
  --ease-bounce: cubic-bezier(.34, 1.56, .64, 1);
  --fl-k: 1.4; --fl-ts: 0.75;
  --font: "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
@media (min-width: 734px) { :root { --gutter: 40px; } }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; font-family: var(--font); background: var(--bg-white); color: var(--text); line-height: 1.5; letter-spacing: 0; -webkit-font-smoothing: antialiased; word-break: keep-all; overflow-x: hidden; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 3px; border-radius: 6px; }
.wrap { width: 100%; max-width: calc(var(--max) + var(--gutter) * 2); margin: 0 auto; padding-inline: var(--gutter); }
.num { font-variant-numeric: tabular-nums; }

/* ── 상단 바 ── */
.localnav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; height: var(--nav-h); background: rgba(255, 255, 255, .78); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); border-bottom: 1px solid rgba(0, 0, 0, .08); }
.localnav .wrap { height: 100%; display: flex; align-items: center; gap: 16px; }
.brand { position: relative; font-size: 20px; font-weight: 700; letter-spacing: -0.02em; white-space: nowrap; }
.navlinks { margin-left: auto; display: flex; gap: 20px; }
.navlink { font-size: 14px; color: var(--text-2); white-space: nowrap; transition: opacity .2s; }
@media (max-width: 480px) { .navlinks { gap: 12px; } .navlink { font-size: 13px; } .brand { font-size: 17px; } }
.navlink:hover { opacity: .6; }

/* i 점 마름모: 점 없는 ı 위에 빨간 마름모 (글자 크기의 약 0.16em) */
/* i 점 마름모: 점 없는 ı를 쓰고, 실제 'i' 글자의 점 자리를 재서 그 위치에 빨간 마름모를 놓음 (placeIDots) */
.idot { display: inline-block; }
.idot .bl { display: inline-block; width: 0; height: 0; vertical-align: baseline; }
.idia { position: absolute; left: 0; top: 0; background: var(--brand); transform: rotate(45deg); pointer-events: none; opacity: 0; }
.idia.on { opacity: 1; }

/* ── 히어로 (다이어그램과 한 화면으로 이어짐) ── */
.hero { position: relative; overflow: hidden; }
.hero canvas.pattern { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; }
.shapes { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
.shp { position: absolute; }
.shp .fl { animation: float calc(var(--ft) * var(--fl-ts)) ease-in-out 1.3s infinite alternate; }
.shp .in { animation: enter 1.1s var(--ease-out) var(--d) both; }
.shp svg { display: block; width: 100%; height: 100%; overflow: visible; }
@keyframes enter { from { transform: translate(var(--dx), var(--dy)) rotate(var(--r, 0deg)); } }
@keyframes float { to { transform: translate(calc(var(--fx) * var(--fl-k)), calc(var(--fy) * var(--fl-k))) rotate(var(--fr, 0deg)); } }

.hero-inner { position: relative; z-index: 2; padding-block: clamp(40px, 7vw, 88px) 28px; display: grid; gap: 18px; pointer-events: none; }
.hero-inner > * { pointer-events: auto; justify-self: start; }
.eyebrow { margin: 0; font-size: 14px; font-weight: 700; letter-spacing: .04em; color: var(--text-2); animation: fade .5s ease .2s both; }
.display { margin: 0; font-size: clamp(56px, 11vw, 140px); font-weight: 800; line-height: .95; letter-spacing: -0.055em; }
.display .word { position: relative; display: inline-block; white-space: nowrap; }
.display .mask { display: inline-block; overflow: hidden; padding: .08em .03em .16em; margin: -.08em -.03em -.16em; vertical-align: top; }
.display .ch { display: inline-block; animation: rise .7s var(--ease-out) calc(.32s + var(--i) * 35ms) both; }
.display .idia.on { animation: drop .5s var(--ease-bounce) 1.08s both; }
.lead { margin: 0; font-size: clamp(22px, 2.8vw, 36px); font-weight: 800; letter-spacing: -0.05em; line-height: 1.2; animation: up .9s var(--ease-out) .46s both; }
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { transform: translateY(110%); } }
@keyframes drop { from { transform: translateY(-2.4em) rotate(45deg); opacity: 0; } 40% { opacity: 1; } }
@keyframes up { from { opacity: 0; transform: translateY(14px); } }

.stats { display: flex; flex-wrap: wrap; gap: 10px; margin: 6px 0 0; padding: 0; list-style: none; animation: up .9s var(--ease-out) .7s both; }
.stat { position: relative; isolation: isolate; min-width: 112px; padding: 12px 16px 11px; border-radius: 16px; background: var(--bg-white); border: 1px solid var(--shape-gray); transition: transform .25s var(--ease-out); }
.stat::before { content: ""; position: absolute; inset: -1px; border-radius: inherit; background: var(--brand); opacity: 0; transition: opacity .25s; z-index: -1; }
.stat:hover { transform: translateY(-6px); }
.stat:hover::before { opacity: 1; }
.stat-n { display: block; font-size: 30px; font-weight: 800; line-height: 1; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; transition: color .25s; }
.stat-l { display: block; margin-top: 6px; font-size: 13px; color: var(--text-2); transition: color .25s; }
.stat:hover .stat-n, .stat:hover .stat-l { color: var(--brand-ink); }

/* ── 다이어그램 ── */
.diagram { position: relative; z-index: 3; padding-bottom: 56px; scroll-margin-top: var(--nav-h); }
.dg-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding-block: 14px; border-top: 1px solid var(--line); }
.seg { display: inline-flex; padding: 3px; border-radius: 999px; background: var(--bg-gray); }
.seg button { padding: 6px 14px; border-radius: 999px; font-size: 14px; font-weight: 600; color: var(--text-2); }
.seg button[aria-pressed="true"] { background: var(--bg-white); color: var(--text); box-shadow: 0 1px 3px rgba(0, 0, 0, .1); }
.pill-btn { display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line); font-size: 14px; font-weight: 600; background: var(--bg-white); transition: opacity .2s; }
.pill-btn:hover { opacity: .6; }
.pill-btn svg { width: 12px; height: 12px; }
.progress { display: flex; align-items: center; gap: 6px; }
.pdot { position: relative; overflow: hidden; width: 8px; height: 8px; border-radius: 4px; background: var(--line); transition: width .3s var(--ease); }
.pdot.on { width: 40px; background: var(--shape-gray); }
.pdot .pfill { position: absolute; inset: 0; background: var(--brand); transform-origin: left center; transform: scaleX(0); transition: transform .3s var(--ease); }
.pdot.on .pfill { transform: scaleX(var(--p, 0)); }
.pdot:not(.on) .pfill { opacity: 0; }
.plabel { font-size: 14px; font-weight: 600; white-space: nowrap; }
.plabel .num { color: var(--text-2); font-weight: 500; }
.bar-right { margin-left: auto; display: flex; gap: 10px; align-items: center; }
.file-in { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

.dg-body { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
@media (max-width: 980px) { .dg-body { grid-template-columns: minmax(0, 1fr); } }
.viewport { position: relative; height: var(--vh, 640px); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; background: var(--bg-white); }
.scroller { position: absolute; inset: 0; overflow: auto; cursor: grab; scrollbar-width: thin; overscroll-behavior-x: contain; }
.scroller.panning { cursor: grabbing; user-select: none; }
.scroller svg { display: block; }
.lane-ov { position: absolute; left: 0; top: 0; bottom: 0; z-index: 2; pointer-events: none; overflow: hidden; background: linear-gradient(to right, var(--bg-white) 78%, rgba(255, 255, 255, 0)); }
.lane-ov-in { position: absolute; left: 0; top: 0; right: 0; will-change: transform; }
.band-ov { position: absolute; left: 0; top: 0; right: 0; z-index: 3; overflow: hidden; pointer-events: none; background: var(--bg-white); border-bottom: 1px solid var(--shape-gray); }
.band-ov-in { position: absolute; left: 0; top: 0; will-change: transform; }
.band-ov-in svg { display: block; }
.band-ov::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; z-index: 1; width: var(--lw, 152px); background: linear-gradient(to right, var(--bg-white) 78%, rgba(255, 255, 255, 0)); }
.lane-lab { position: absolute; left: 14px; right: 18px; display: flex; flex-direction: column; justify-content: center; gap: 2px; font-size: 13px; font-weight: 700; line-height: 1.25; }
.lane-lab small { font-size: 12px; font-weight: 500; color: var(--text-2); }
.empty-note { padding: 24px; color: var(--text-2); }

/* 노드: 기본 · 실루엣 · 빨간 윤곽 · 빨간 채움 4겹, 상태는 각 겹의 opacity로만 */
.node { cursor: pointer; outline: none; }
.node .lift { transition: transform .25s var(--ease-out); }
.node .l-base { fill: var(--bg-white); stroke: var(--line); stroke-width: 1.5; transition: opacity .25s; }
.node.t-discuss .l-base { stroke-dasharray: 5 4; }
.node.t-end .l-base { fill: var(--bg-gray); stroke: var(--trace-1); }
.node .l-sil { fill: var(--shape-gray); opacity: 0; transition: opacity .25s; }
.node .l-ring { fill: none; stroke: var(--brand); stroke-width: 2.5; opacity: 0; transition: opacity .25s; }
.node .l-fill { fill: var(--brand); opacity: 0; transition: opacity .25s; }
.node .nid { font-size: 10.5px; font-weight: 600; fill: var(--text-3); font-variant-numeric: tabular-nums; letter-spacing: .02em; transition: fill .25s, opacity .25s; }
.node .lbl { font-size: 12.5px; font-weight: 600; fill: var(--text); transition: fill .25s, opacity .25s; }
.node:hover .lift, .node:focus-visible .lift { transform: translateY(-4px); }
.node.is-next .l-ring { opacity: 1; }
.node.is-next .lbl { fill: var(--brand); }
.node.is-current .l-fill, .node:hover .l-fill, .node:focus-visible .l-fill { opacity: 1; }
.node.is-current .lbl, .node.is-current .nid, .node:hover .lbl, .node:hover .nid, .node:focus-visible .lbl, .node:focus-visible .nid { fill: var(--brand-ink); }
.node.is-teased { cursor: not-allowed; }
.node.is-teased .l-sil { opacity: 1; }
.node.is-teased .l-base, .node.is-teased .lbl, .node.is-teased .nid, .node.is-teased .l-fill, .node.is-teased .l-ring { opacity: 0 !important; }
.node.is-teased .lift { transform: none !important; }
.node.is-hidden, .edge.is-hidden, .part.is-hidden { opacity: 0; pointer-events: none; }
.node, .edge, .part { transition: opacity .3s; }

.edge .e-base { fill: none; stroke: var(--trace-1); stroke-width: 1.5; }
.edge .a-base { fill: var(--trace-1); }
.edge .e-hot { fill: none; stroke: var(--brand); stroke-width: 2; opacity: 0; transition: opacity .25s; }
.edge .a-hot { fill: var(--brand); opacity: 0; transition: opacity .25s; }
.edge.k-reject path.e-base, .edge.k-reject path.e-hot, .edge.k-return path.e-base, .edge.k-return path.e-hot, .edge.k-repeat path.e-base, .edge.k-repeat path.e-hot { stroke-dasharray: 5 4; }
.edge.k-reject .e-base, .edge.k-repeat .e-base { stroke: var(--trace-2); }
.edge.k-reject .a-base, .edge.k-repeat .a-base { fill: var(--trace-2); }
.edge.is-next .e-hot, .edge.is-next .a-hot { opacity: 1; }
.edge .elabel { font-size: 11px; font-weight: 600; fill: var(--text-2); paint-order: stroke; stroke: var(--bg-white); stroke-width: 4px; stroke-linejoin: round; transition: opacity .25s; }
.edge.is-next .elabel { fill: var(--brand); }
.edge.is-teased .e-base, .edge.is-teased .a-base { stroke: var(--shape-gray); fill: var(--shape-gray); }
.edge.is-teased .a-base { stroke: none; }
.edge.is-teased .elabel { opacity: 0; }
.part .p-line { stroke: var(--line); stroke-width: 1; stroke-dasharray: 2 3; }
.part .p-mark { fill: var(--trace-1); }
.part .p-hotline { stroke: var(--brand); stroke-width: 1.5; stroke-dasharray: 2 3; opacity: 0; transition: opacity .25s; }
.part .p-hot { fill: var(--brand); opacity: 0; transition: opacity .25s; }
.part.is-current .p-hot, .part.is-current .p-hotline { opacity: 1; }
.lane-bg { fill: var(--bg-white); }
.lane-bg.alt { fill: var(--bg-near); }
.lane-sep { stroke: var(--shape-gray); }
.band-phase line { stroke: var(--text); stroke-width: 2; }
.band-phase line.hot { stroke: var(--brand); opacity: 0; transition: opacity .25s; }
.band-phase.on line.hot { opacity: 1; }
.band-phase text { font-size: 14px; font-weight: 700; fill: var(--text); letter-spacing: -0.01em; }
.band-step rect { fill: var(--bg-gray); }
.band-step text { font-size: 12px; font-weight: 600; fill: var(--text-2); }
.band-unit path { fill: none; stroke: var(--line); }
.band-unit text { font-size: 11.5px; font-weight: 500; fill: var(--text-3); }
.band-unit.rep text { font-weight: 700; fill: var(--brand); }
.band-unit.rep path { stroke: var(--brand); }
.node .appr { font-size: 10px; font-weight: 600; fill: var(--text-2); transition: fill .25s; }
.node.is-current .appr, .node:hover .appr, .node:focus-visible .appr, .node.hl .appr { fill: var(--brand-ink); }

.bubble { position: absolute; z-index: 6; left: 0; top: 0; max-width: 260px; padding: 8px 12px; border-radius: 10px; background: var(--bubble); color: #fff; font-size: 13px; line-height: 1.4; pointer-events: none; opacity: 0; transform: translate(-50%, calc(-100% + 8px)); transition: opacity .2s, transform .2s var(--ease-out); }
.bubble.on { opacity: 1; transform: translate(-50%, -100%); }
.bubble::after { content: ""; position: absolute; left: 50%; bottom: -5px; width: 10px; height: 10px; background: var(--bubble); transform: translateX(-50%) rotate(45deg); }
.bubble b { font-weight: 700; }
.bubble span { display: block; color: rgba(255, 255, 255, .72); font-size: 12px; }

.legend { display: flex; flex-wrap: wrap; gap: 8px 18px; margin: 0 0 12px; padding: 10px 14px; border-radius: 14px; background: var(--bg-gray); font-size: 13px; color: var(--text-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.legend svg { width: 26px; height: 18px; overflow: visible; }
.legend .rep-mark { color: var(--brand); font-weight: 700; }
.legend .appr-mark { font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 6px; background: var(--bg-white); color: var(--text-2); }

/* 상세 패널 */
.panel { height: var(--vh, 640px); overflow: auto; border: 1px solid var(--line); border-radius: 20px; padding: 20px; background: var(--bg-white); }
@media (max-width: 980px) { .panel { height: auto; max-height: none; } }
.p-crumb { margin: 0; font-size: 13px; color: var(--text-2); }
.p-head { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
.p-id { font-size: 14px; font-weight: 700; color: var(--text-3); font-variant-numeric: tabular-nums; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 8px; border-radius: 999px; background: var(--bg-gray); font-size: 13px; font-weight: 600; }
.chip svg { width: 16px; height: 12px; overflow: visible; }
.p-title { margin: 6px 0 0; font-size: 24px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.25; text-wrap: balance; }
.p-sec { margin-top: 22px; }
.p-sec h4 { margin: 0 0 8px; font-size: 13px; font-weight: 700; letter-spacing: .04em; color: var(--text-2); }
.conn { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.conn button { width: 100%; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 10px; align-items: baseline; text-align: left; padding: 8px 10px; border-radius: 12px; background: var(--bg-near); border: 1px solid var(--shape-light); transition: opacity .2s; }
.conn button:hover { opacity: .6; }
.conn .k { font-size: 12px; font-weight: 700; color: var(--brand); white-space: nowrap; }
.conn .k.muted { color: var(--text-2); }
.conn .t { font-size: 14px; font-weight: 600; min-width: 0; }
.conn .d { grid-column: 2; font-size: 12px; color: var(--text-2); }
.conn .none { font-size: 14px; color: var(--text-3); }
.kv { margin: 0; display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 8px 12px; font-size: 14px; }
.kv dt { color: var(--text-2); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.blank { display: inline-block; padding: 0 8px; border-radius: 6px; border: 1px dashed var(--line); color: var(--text-3); font-size: 13px; }
.blank em { font-style: normal; color: var(--text-2); }
.roles { display: flex; flex-wrap: wrap; gap: 6px; }
.role { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line); font-size: 12.5px; color: var(--text-3); }
.role.on { color: var(--text); border-color: var(--text); }
.role.owner { background: var(--text); color: #fff; border-color: var(--text); }
.p-nav { display: flex; justify-content: space-between; gap: 8px; margin-top: 24px; }

/* 마름모 커서 팔로워 + 파동 */
.follower { position: fixed; left: 0; top: 0; z-index: 60; pointer-events: none; opacity: 0; }
.follower.on { opacity: 1; }
.follower .f-dot, .follower .f-ring { position: absolute; left: 0; top: 0; transition: transform .3s var(--ease-bounce); }
.follower .f-dot { width: 8px; height: 8px; margin: -4px 0 0 -4px; background: var(--brand); transform: rotate(45deg) scale(1); }
.follower .f-ring { width: 17px; height: 17px; margin: -8.5px 0 0 -8.5px; border: 2px solid var(--brand); transform: rotate(45deg) scale(0); }
.follower.on-node .f-dot { transform: rotate(45deg) scale(0); }
.follower.on-node .f-ring { transform: rotate(45deg) scale(1); }
.follower.pop .f-dot { animation: pop .32s var(--ease-out); }
.follower.out .f-dot { animation: shrink .16s ease-in forwards; }
@keyframes pop { 0% { transform: rotate(45deg) scale(0); } 60% { transform: rotate(45deg) scale(1.3); } 100% { transform: rotate(45deg) scale(1); } }
@keyframes shrink { to { transform: rotate(45deg) scale(0); } }
.ripple { position: fixed; z-index: 59; width: 17px; height: 17px; margin: -8.5px 0 0 -8.5px; border: 2px solid var(--brand); pointer-events: none; transform: rotate(45deg) scale(.3); animation: ripple .56s var(--ease-out) forwards; }
.ripple.in { animation: ripple-in .38s ease-in forwards; }
@keyframes ripple { from { transform: rotate(45deg) scale(.3); opacity: 1; } to { transform: rotate(45deg) scale(3.2); opacity: 0; } }
@keyframes ripple-in { from { transform: rotate(45deg) scale(3.2); opacity: 0; } 30% { opacity: .9; } to { transform: rotate(45deg) scale(.3); opacity: 0; } }

/* 히어로 카드: 누르면 눌린 상태로 남음 */
.stats li { display: flex; }
button.stat { font: inherit; text-align: left; cursor: pointer; color: inherit; }
.stat[aria-pressed="true"] { transform: translateY(2px) scale(.97); box-shadow: inset 0 3px 8px rgba(0, 0, 0, .22); }
.stat[aria-pressed="true"]::before { opacity: 1; }
.stat[aria-pressed="true"] .stat-n, .stat[aria-pressed="true"] .stat-l { color: var(--brand-ink); }
.focus-chip { border-color: var(--brand); color: var(--brand); }
.focus-chip span[aria-hidden] { font-size: 12px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* 한눈에: 선 두께는 화면 기준으로 유지 */
#flow.ov path, #flow.ov line { vector-effect: non-scaling-stroke; }
#flow.ov .node .lift { transition: none; }
#flow.ov .node:hover .lift { transform: none; }

<script>
/* 조정 값: 원본 랜딩페이지 CONFIG와 같은 이름·수치 */
const CONFIG = {
  layout: { colW: 162, nodeW: 108, confirmW: 124, phaseGap: 56, labelW: 152, laneCore: 66, lanePad: 28, bandTop: 14 },
  camera: { distanceFactor: 1.5, minDuration: 500, maxDuration: 1000 },
  play: { interval: 2600 },
  // 반복 단위 띠(빨간 ↻ 글씨)를 그리지 않을 과정
  hideRepeatBand: ['킥오프'],
  push: { min: 10, max: 24, reach: 40, ease: 140 },
  pattern: { cell: 32, radius: 64, decayPerSec: 0.7, trailMax: 0.38, trailScale: 0.13, waveMax: 0.55, noise: 0.7, diamondRate: 0.05, timers: 3, waveEvery: [700, 2000], waveRadius: [5, 12], waveDur: [1700, 2700], waveSpread: 600, textDim: 0.45, step: 12, maxSteps: 24 },
  follower: { lag: 70, flicker: 300 },
};
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FINE = matchMedia('(hover: hover) and (pointer: fine)').matches;
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const TYPE_KEY = { '작업': 'task', '회의': 'meeting', '컨펌': 'confirm', '픽스': 'fix', '논의': 'discuss' };
const TYPE_ORDER = ['task', 'meeting', 'discuss', 'confirm', 'fix', 'other', 'end'];
const KIND_NAME = { next: '다음', branch: '갈림길', reject: '반려', return: '수정 후', repeat: '반복' };
// 페이지에 보여 주지 않는 열 (표에는 그대로 있음)
const HIDE_COLS = ['산출물', '소요시간', '사용 도구', '불편·병목 메모'];

/* ═════════════ 1. 표 → 모델 ═════════════ */
function buildModel(header, rows) {
  const col = (n) => header.indexOf(n);
  const C = { id: col('작업ID'), phase: col('과정'), unit: col('반복 단위'), step: col('세부단계'), name: col('작업'), type: col('유형'), owner: col('담당(실행)'), collab: col('협업·승인'), cond: col('실행 조건'), reject: col('반려·반복 시'), next: col('다음 작업'), note: col('비고') };
  const missing = Object.entries(C).filter(([, v]) => v < 0).map(([k]) => k);
  if (missing.length) throw new Error('표에서 필요한 열을 찾지 못했습니다: ' + missing.join(', '));
  const roleCols = [];
  for (let i = C.collab + 1; i < C.cond; i++) roleCols.push(i);
  const roles = roleCols.map((i) => header[i]);
  const g = (r, i) => (r[i] || '').trim();

  const tasks = rows.filter((r) => g(r, C.id)).map((r, i) => ({
    id: g(r, C.id), i, phase: g(r, C.phase), unit: g(r, C.unit), step: g(r, C.step), name: g(r, C.name),
    type: g(r, C.type), tkey: TYPE_KEY[g(r, C.type)] || 'other', owner: g(r, C.owner), collab: g(r, C.collab),
    cond: g(r, C.cond), reject: g(r, C.reject), next: g(r, C.next), note: g(r, C.note), raw: r,
    marked: roles.filter((_, k) => g(r, roleCols[k])), out: [], in: [], terminals: [],
  }));
  const byId = new Map(tasks.map((t) => [t.id, t]));
  const nodes = new Map(tasks.map((t) => [t.id, t]));
  const edges = [];
  const problems = { missingRefs: [] };
  let termN = 0;
  const addEdge = (e) => {
    if (edges.some((x) => x.from === e.from && x.to === e.to && x.kind === e.kind)) return null;
    edges.push(e);
    return e;
  };

  // 다음 작업: "T02" / "피드백 있음 T67 / 없음 T69" / "완료"
  tasks.forEach((t) => {
    const parts = t.next ? t.next.split('/').map((s) => s.trim()).filter(Boolean) : [];
    const branch = parts.length > 1;
    parts.forEach((p) => {
      const m = p.match(/T\d+/);
      if (m) {
        if (!byId.has(m[0])) { problems.missingRefs.push({ from: t.id, ref: m[0], col: '다음 작업' }); return; }
        addEdge({ from: t.id, to: m[0], kind: branch ? 'branch' : 'next', label: p.slice(0, m.index).trim(), col: '다음 작업' });
      } else {
        let label = '', text = p;
        if (branch) { const sp = p.split(/\s+/); if (sp.length > 1) { label = sp[0]; text = sp.slice(1).join(' '); } }
        const term = { id: 'END' + (++termN), terminal: true, name: text, raw: p, src: t.id, phase: t.phase, step: t.step, unit: t.unit, owner: t.owner, tkey: 'end', type: '끝 표시', marked: [], out: [], in: [] };
        nodes.set(term.id, term);
        t.terminals.push(term);
        addEdge({ from: t.id, to: term.id, kind: branch ? 'branch' : 'next', label, col: '다음 작업' });
      }
    });
  });
  // 반려·반복 시: "T06 수정 후 재컨펌" / "T06 수정 후 T09 최종 픽스" / "T66 빌드 확인으로 반복 (…)"
  tasks.forEach((t) => {
    if (!t.reject) return;
    const ids = t.reject.match(/T\d+/g) || [];
    const repeat = t.reject.includes('반복');
    const target = ids[0];
    if (!target) return;
    if (!byId.has(target)) { problems.missingRefs.push({ from: t.id, ref: target, col: '반려·반복 시' }); return; }
    const same = edges.find((e) => e.from === t.id && e.to === target && (e.kind === 'next' || e.kind === 'branch'));
    if (same) {
      if (repeat) { same.kind = 'repeat'; same.label = same.label || '반복'; }
      else if (same.kind === 'branch' && same.label.includes('반려')) same.kind = 'reject';
      else same.alsoReject = true;
    } else {
      addEdge({ from: t.id, to: target, kind: repeat ? 'repeat' : 'reject', label: repeat ? '반복' : '반려', col: '반려·반복 시' });
    }
    if (t.reject.includes('재컨펌')) addEdge({ from: target, to: t.id, kind: 'return', label: '재컨펌', col: '반려·반복 시', via: t.id });
    if (ids[1]) {
      if (byId.has(ids[1])) addEdge({ from: target, to: ids[1], kind: 'return', label: '수정 후', col: '반려·반복 시', via: t.id });
      else problems.missingRefs.push({ from: t.id, ref: ids[1], col: '반려·반복 시' });
    }
  });
  const used = new Set();
  edges.forEach((e) => {
    let id = `e_${e.from}_${e.to}`;
    if (used.has(id)) id += '_' + e.kind;
    used.add(id);
    e.id = id;
    nodes.get(e.from).out.push(e);
    nodes.get(e.to).in.push(e);
  });

  const phases = [];
  tasks.forEach((t) => {
    let p = phases.find((x) => x.name === t.phase);
    if (!p) { p = { name: t.phase, tasks: [] }; phases.push(p); }
    p.tasks.push(t);
  });
  const cols = [];
  tasks.forEach((t) => { cols.push(t.id); t.terminals.forEach((x) => cols.push(x.id)); });
  const lanes = roles.slice();
  tasks.forEach((t) => { if (!lanes.includes(t.owner)) lanes.push(t.owner || '(담당 비어 있음)'); });
  return { header, rows, C, roles, roleCols, lanes, tasks, byId, nodes, edges, phases, cols, problems };
}

function render(M) {

/* ═════════════ 4. 상태 · 상호작용 ═════════════ */
const S = { mode: 'all', zoom: 'detail', focus: null, focusRole: null, current: null, revealed: new Set(), teased: new Set(), playing: false, timer: 0, scale: 1 };
let M = null;

function reveal(id) {

  S.revealed.add(id);
  n.out.forEach((e) => {
    S.revealed.add(e.id); S.revealed.add(e.to);

function select(id, { move = true, ripple = true, instant = false } = {}) {

/* 카메라: 노드 중심으로 스크롤, 이동 거리 × 1.5ms를 0.5~1초로, 지수 감속 */
let camRaf = 0;
const expOut = (t) => (t >= 1 ? 1 : 1 - Math.pow(2, -10 * t));
function moveTo(n, instant) {
  const sc = $('#scroller');
  const s = S.scale;
  const labelW = CONFIG.layout.labelW * s;
  const tx = Math.max(0, Math.min(sc.scrollWidth - sc.clientWidth, n.x * s - (sc.clientWidth + labelW) / 2));
  // 세로는 노드가 이미 보이면 그대로 둠 (위쪽 과정 띠가 가려지지 않게)
  const head = M.headH * s;
  const inView = n.y * s - n.h * s / 2 > sc.scrollTop + head + 16 && n.y * s + n.h * s / 2 < sc.scrollTop + sc.clientHeight - 24;
  const ty = inView ? sc.scrollTop : Math.max(0, Math.min(sc.scrollHeight - sc.clientHeight, n.y * s - (sc.clientHeight + head) / 2));
  const x0 = sc.scrollLeft, y0 = sc.scrollTop;
  const dist = Math.hypot(tx - x0, ty - y0);
  cancelAnimationFrame(camRaf);
  if (instant || REDUCED || dist < 1) { sc.scrollLeft = tx; sc.scrollTop = ty; return; }
  const C = CONFIG.camera;
  const dur = Math.min(Math.max(dist * C.distanceFactor, C.minDuration), C.maxDuration);
  const t0 = performance.now();
  const step = (now) => {
    const k = expOut((now - t0) / dur);
    sc.scrollLeft = x0 + (tx - x0) * k;
    sc.scrollTop = y0 + (ty - y0) * k;
    if (k < 1) camRaf = requestAnimationFrame(step);
  };
  camRaf = requestAnimationFrame(step);
}

/* 'i'와 'ı'를 캔버스에 그려 차이(= 점)의 중심과 크기를 잼. 결과는 글자 시작점·기준선 기준 */
function measureIDot(font, size) {
  const W = Math.ceil(size * 1.2), H = Math.ceil(size * 1.6), x0 = Math.round(size * 0.2), base = Math.round(size * 1.2);
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d', { willReadFrequently: true });
  const draw = (ch) => { g.clearRect(0, 0, W, H); g.font = font; g.fillStyle = '#000'; g.textBaseline = 'alphabetic'; g.fillText(ch, x0, base); return g.getImageData(0, 0, W, H).data; };
  const a = draw('i'), b = draw('ı');
  let x1 = W, x2 = -1, y1 = H, y2 = -1;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const k = (y * W + x) * 4 + 3;
    if (a[k] > 128 && b[k] < 40) { if (x < x1) x1 = x; if (x > x2) x2 = x; if (y < y1) y1 = y; if (y > y2) y2 = y; }
  }
  if (x2 < 0) return null;
  return { cx: (x1 + x2 + 1) / 2 - x0, cy: (y1 + y2 + 1) / 2 - base, w: x2 - x1 + 1 };
}
function placeIDots() {
  document.querySelectorAll('.idot').forEach((el) => {
    const host = el.closest('.word') || el.closest('.brand');
    const dia = host && host.querySelector('.idia');
    const bl = el.querySelector('.bl');
    if (!dia || !bl) return;
    const cs = getComputedStyle(el);
    const size = parseFloat(cs.fontSize);
    const m = measureIDot(`${cs.fontWeight} ${size}px ${cs.fontFamily}`, size);
    if (!m) return;
    // offsetLeft/offsetTop은 등장 애니메이션의 transform 영향을 받지 않음
    let ox = 0, oy = 0, n = el;
    while (n && n !== host) { ox += n.offsetLeft; n = n.offsetParent; }
    n = bl; while (n && n !== host) { oy += n.offsetTop; n = n.offsetParent; }
    // 원본 규격 0.16em, 작은 글자(상단 바)에서는 점보다 작아 보이지 않게 조금 키움
    const side = Math.max(size * (size < 40 ? 0.24 : 0.16), m.w * 0.95);
    dia.style.width = dia.style.height = side + 'px';
    dia.style.left = (ox + m.cx - side / 2) + 'px';
    dia.style.top = (oy + m.cy - side / 2) + 'px';
    dia.classList.add('on');
  });
}

  let mx = -1e4, my = -1e4, raf = 0, last = 0;
  hero.addEventListener('pointermove', (e) => { mx = e.clientX; my = e.clientY; kick(); });
  hero.addEventListener('pointerleave', () => { mx = my = -1e4; kick(); });
  const kick = () => { if (!raf) { last = performance.now(); raf = requestAnimationFrame(tick); } };
  function tick(now) {
    const dt = Math.min(64, now - last); last = now;
    let moving = false;
    const P = CONFIG.push;
    shapeEls.forEach((s) => {
      const r = s.inner.getBoundingClientRect();
      const cx = r.left + r.width / 2 - s.cx, cy = r.top + r.height / 2 - s.cy;
      const rad = Math.min(r.width, r.height) / 2;
      const dx = cx - mx, dy = cy - my, dist = Math.hypot(dx, dy) || 1;
      const k = Math.max(0, Math.min(1, 1 - (dist - rad) / P.reach));
      s.tx = (dx / dist) * s.amp * k; s.ty = (dy / dist) * s.amp * k;
      const f = 1 - Math.exp(-dt / P.ease);
      s.cx += (s.tx - s.cx) * f; s.cy += (s.ty - s.cy) * f;
      s.push.style.transform = `translate(${s.cx.toFixed(2)}px, ${s.cy.toFixed(2)}px)`;
      if (Math.abs(s.tx - s.cx) > 0.1 || Math.abs(s.ty - s.cy) > 0.1) moving = true;
    });
    raf = moving || mx > -1e4 ? requestAnimationFrame(tick) : 0;
  }
}

/* 커서 반응 패턴 + 자동 물결 (히어로만) */
function initPattern() {
  const cv = $('#pattern'), hero = $('#top'), ctx = cv.getContext('2d');
  const PC = CONFIG.pattern;
  let W = 0, H = 0, cols = 0, rows = 0, types, energy, wStart, wDur, dim, colors, visible = true, raf = 0, last = 0;
  const hash = (x, y) => { let h = (x * 374761393 + y * 668265263 + 20261013) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
  const smooth = (t) => t * t * (3 - 2 * t);
  const vnoise = (x, y) => {
    const xi = Math.floor(x), yi = Math.floor(y), xf = smooth(x - xi), yf = smooth(y - yi);
    const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
    return (a + (b - a) * xf) + ((c + (d - c) * xf) - (a + (b - a) * xf)) * yf;
  };
  function setup() {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    W = hero.clientWidth; H = hero.clientHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cols = Math.ceil(W / PC.cell); rows = Math.ceil(H / PC.cell);
    const N = cols * rows;
    types = new Uint8Array(N); energy = new Float32Array(N); wStart = new Float64Array(N); wDur = new Float32Array(N); dim = new Uint8Array(N);
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      const i = r * cols + c;
      const edge = Math.min(r, rows - 1 - r);
      if (edge < 2 && hash(c + 999, r) < (edge === 0 ? 0.7 : 0.4)) { types[i] = 0; continue; }
      if (hash(c, r + 777) < PC.diamondRate) types[i] = 3;
      else if (vnoise(c / 4, r / 4) > PC.noise) types[i] = 2;
      else types[i] = 1;
    }
    const hr = hero.getBoundingClientRect();
    document.querySelectorAll('#heroInner .eyebrow, #heroInner .display .word, #heroInner .lead, #heroInner .stats').forEach((el) => {
      const b = el.getBoundingClientRect();
      const c0 = Math.floor((b.left - hr.left - 14) / PC.cell), c1 = Math.floor((b.right - hr.left + 14) / PC.cell);
      const r0 = Math.floor((b.top - hr.top - 14) / PC.cell), r1 = Math.floor((b.bottom - hr.top + 14) / PC.cell);
      for (let r = Math.max(0, r0); r <= Math.min(rows - 1, r1); r++) for (let c = Math.max(0, c0); c <= Math.min(cols - 1, c1); c++) dim[r * cols + c] = 1;
    });
    const cs = getComputedStyle(document.documentElement);
    colors = { 1: cs.getPropertyValue('--pat-circle').trim(), 2: cs.getPropertyValue('--shape-mid').trim(), t1: cs.getPropertyValue('--trace-1').trim(), t2: cs.getPropertyValue('--trace-2').trim(), 3: cs.getPropertyValue('--brand').trim() };
  }
  // 커서 흔적: 반경 64px, 0.5 × (1 − 거리/64), 이전 위치와 12px 간격(최대 24단계)으로 메움
  let px = null, py = null;
  function addEnergy(x, y) {
    const R = PC.radius, c0 = Math.floor((x - R) / PC.cell), c1 = Math.floor((x + R) / PC.cell), r0 = Math.floor((y - R) / PC.cell), r1 = Math.floor((y + R) / PC.cell);
    for (let r = Math.max(0, r0); r <= Math.min(rows - 1, r1); r++) for (let c = Math.max(0, c0); c <= Math.min(cols - 1, c1); c++) {
      const d = Math.hypot(c * PC.cell + PC.cell / 2 - x, r * PC.cell + PC.cell / 2 - y);
      if (d < R) { const i = r * cols + c; energy[i] = Math.min(1, energy[i] + 0.5 * (1 - d / R)); }
    }
  }
  if (FINE && !REDUCED) {
    hero.addEventListener('pointermove', (e) => {
      const b = hero.getBoundingClientRect(), x = e.clientX - b.left, y = e.clientY - b.top;
      if (px !== null) {
        const n = Math.min(PC.maxSteps, Math.ceil(Math.hypot(x - px, y - py) / PC.step));
        for (let k = 1; k <= n; k++) addEnergy(px + (x - px) * k / n, py + (y - py) * k / n);
      } else addEnergy(x, y);
      px = x; py = y; start();
    });
    hero.addEventListener('pointerleave', () => { px = py = null; });
  }
  // 자동 물결: 타이머 3개가 0.7~2초마다 중심 칸, 반경 5~12칸, 거리 따라 최대 0.6초 시차, 1.7~2.7초 보임
  const rnd = (a, b) => a + Math.random() * (b - a);
  function wave() {
    if (!rows) return;
    const now = performance.now();
    const cc = Math.floor(Math.random() * cols), cr = Math.floor(Math.random() * rows), R = Math.round(rnd(PC.waveRadius[0], PC.waveRadius[1]));
    for (let r = Math.max(0, cr - R); r <= Math.min(rows - 1, cr + R); r++) for (let c = Math.max(0, cc - R); c <= Math.min(cols - 1, cc + R); c++) {
      const d = Math.hypot(c - cc, r - cr);
      if (d > R) continue;
      const i = r * cols + c;
      if (now < wStart[i] + wDur[i]) continue;
      wStart[i] = now + (d / R) * PC.waveSpread; wDur[i] = rnd(PC.waveDur[0], PC.waveDur[1]);
    }
  }
  function draw(now) {
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    ctx.clearRect(0, 0, W, H);
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      const i = r * cols + c, ty = types[i];
      if (!ty) continue;
      if (energy[i] > 0) energy[i] = Math.max(0, energy[i] - PC.decayPerSec * dt);
      let w = 0;
      const t = (now - wStart[i]) / wDur[i];
      if (t >= 0 && t <= 1) w = t < 0.25 ? t / 0.25 : t > 0.7 ? (1 - t) / 0.3 : 1;
      const e = energy[i];
      if (w < 0.01 && e < 0.01) continue;
      let alpha, color;
      if (ty === 3) { alpha = Math.max(w, e) * 0.9; color = colors[3]; }
      else if (e * PC.trailMax >= w * PC.waveMax) { alpha = e * PC.trailMax; color = ty === 1 ? colors.t1 : colors.t2; }
      else { alpha = w * PC.waveMax; color = colors[ty]; }
      if (dim[i]) alpha *= PC.textDim;
      if (alpha < 0.01) continue;
      const s = 1 + PC.trailScale * e, x = c * PC.cell + PC.cell / 2, y = r * PC.cell + PC.cell / 2;
      ctx.globalAlpha = alpha; ctx.fillStyle = color;
      ctx.beginPath();
      if (ty === 1) ctx.arc(x, y, 5.5 * s, 0, Math.PI * 2);
      else if (ty === 2) ctx.rect(x - 5.5 * s, y - 5.5 * s, 11 * s, 11 * s);
      else { const h = 6.5 * s; ctx.moveTo(x, y - h); ctx.lineTo(x + h, y); ctx.lineTo(x, y + h); ctx.lineTo(x - h, y); ctx.closePath(); }
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    raf = visible && !document.hidden ? requestAnimationFrame(draw) : 0;
  }
  function start() { if (!raf && visible && !document.hidden) { last = performance.now(); raf = requestAnimationFrame(draw); } }
  setup();
  if (REDUCED) return;
  for (let k = 0; k < PC.timers; k++) { const loop = () => { wave(); setTimeout(loop, rnd(PC.waveEvery[0], PC.waveEvery[1])); }; setTimeout(loop, 1300 + k * 400); }
  new IntersectionObserver(([en]) => { visible = en.isIntersecting; start(); }).observe(hero);
  document.addEventListener('visibilitychange', start);
  let rt = 0;
  window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(setup, 150); });
  start();
}

/* 마름모 커서 팔로워 + 파동 (다이어그램 위에서만) */
function rippleAt(x, y, cls = '') {
  const r = document.createElement('div');
  r.className = 'ripple' + (cls ? ' ' + cls : '');
  r.style.left = x + 'px'; r.style.top = y + 'px';
  r.addEventListener('animationend', () => r.remove());
  document.body.appendChild(r);
}
function rippleAtEl(el) {
  const b = el.getBoundingClientRect();
  const vp = $('#viewport').getBoundingClientRect();
  const x = b.left + b.width / 2, y = b.top + b.height / 2;
  if (x > vp.left && x < vp.right && y > vp.top && y < vp.bottom) rippleAt(x, y);
}
function initFollower() {
  if (!FINE || REDUCED) return;
  const f = document.createElement('div');
  f.className = 'follower';
  f.innerHTML = '<span class="f-dot"></span><span class="f-ring"></span>';
  document.body.appendChild(f);
  const vp = $('#viewport');
  let tx = 0, ty = 0, x = 0, y = 0, raf = 0, last = 0, enterT = 0, leaveT = -1e4;
  const tick = (now) => {
    const dt = Math.min(64, now - last); last = now;
    const k = 1 - Math.exp(-dt / CONFIG.follower.lag);
    x += (tx - x) * k; y += (ty - y) * k;
    f.style.transform = `translate3d(${x}px, ${y}px, 0)`;
    raf = Math.abs(tx - x) > 0.2 || Math.abs(ty - y) > 0.2 ? requestAnimationFrame(tick) : 0;
  };
  vp.addEventListener('pointerenter', (e) => {
    if (e.pointerType !== 'mouse') return;
    x = tx = e.clientX; y = ty = e.clientY;
    f.style.transform = `translate3d(${x}px, ${y}px, 0)`;
    f.classList.remove('out');
    f.classList.add('on');
    const quick = performance.now() - leaveT < CONFIG.follower.flicker;
    enterT = performance.now();
    if (!quick) { rippleAt(x, y); f.classList.remove('pop'); void f.offsetWidth; f.classList.add('pop'); }
  });
  vp.addEventListener('pointermove', (e) => {
    tx = e.clientX; ty = e.clientY;
    f.classList.toggle('on-node', !!e.target.closest('.node:not(.is-teased):not(.is-hidden)'));
    if (!raf) { last = performance.now(); raf = requestAnimationFrame(tick); }
  });
  vp.addEventListener('pointerleave', () => {
    const quick = performance.now() - enterT < CONFIG.follower.flicker;
    leaveT = performance.now();
    f.classList.remove('on-node', 'pop');
    if (quick) { f.classList.remove('on'); return; }
    rippleAt(x, y, 'in');
    f.classList.add('out');
    setTimeout(() => { if (f.classList.contains('out')) f.classList.remove('on', 'out'); }, 170);
  });
}

/* ═════════════ 10. 볼륨 측정 ═════════════ */
/* 숫자는 모두 '볼륨 기준' 시트에서 항목 이름으로 찾아 쓴다. 시트 숫자가 바뀌면 계산도 따라 바뀐다.
   표에 없는 계산 규칙(2종당 내림, 개수 비례)은 기준서의 '계산 방식'에 따로 밝힌다. */
const VOL = { rows: [], cat: null, list: [] };
const VOL_KEY = 'appd-volume-list';
const vnum = (s) => { const m = String(s ?? '').match(/\d+(?:\.\d+)?/); return m ? parseFloat(m[0]) : null; };
const vrow = (cat, label) => VOL.rows.find((r) => r[0] === cat && r[1] === label) || null;
function vpart(row, key) {
  if (!row || !row[3]) return null;
  return row[3].split(',').map((s) => s.trim()).find((s) => s.includes(key)) || null;
}
const vtail = (part) => { const m = part && part.match(/(\d+(?:\.\d+)?)\s*$/); return m ? parseFloat(m[1]) : null; };
const vper = (part) => { const m = part && part.match(/(\d+)\s*종당/); return m ? parseInt(m[1], 10) : 1; };
const vbase = (label) => { const m = label.match(/\((\d+)\s*[개장]\s*기준\)/); return m ? parseInt(m[1], 10) : 1; };
const r2 = (n) => Math.round(n * 100) / 100;

/* 단위 종류별 입력 칸: [id, 종류, 화면 이름, 볼륨, 덧붙임] */
function volumeModel() {
  const M2 = {};
  const add = (cat, f) => { (M2[cat] = M2[cat] || []).push(f); };
  const g = (cat, label) => vrow(cat, label);
  // 인게임
  let r;
  if ((r = g('인게임', '기본'))) add('인게임', { id: 'base', kind: 'fixed', label: '기본', v: vnum(r[2]), src: r });
  if ((r = g('인게임', '화면 전환 또는 배경 2배 이상'))) add('인게임', { id: 'screen', kind: 'check', label: r[1], v: vnum(r[2]), src: r });
  if ((r = g('인게임', '큰 맵 > 오브젝트 배치'))) {
    add('인게임', { id: 'bigmap', kind: 'check', label: r[1], v: vnum(r[2]), src: r });
    const p = vpart(r, '게임 종류');
    if (p) add('인게임', { id: 'games', kind: 'per', label: '게임 종류', unit: '종', per: vper(p), v: vtail(p), src: r, rule: p });
  }
  if ((r = g('인게임', '인게임 팝업 1종당'))) add('인게임', { id: 'popup', kind: 'count', label: '인게임 팝업', unit: '종', v: vnum(r[2]), src: r });
  if ((r = g('인게임', '인게임 데코 (기본 1종)'))) {
    add('인게임', { id: 'deco', kind: 'check', label: r[1], v: vnum(r[2]), src: r, def: true });
    const p = vpart(r, '카테고리 추가');
    if (p) add('인게임', { id: 'decoAdd', kind: 'per', label: '데코 카테고리 추가', unit: '종', per: vper(p), v: vtail(p), src: r, rule: p });
  }
  if ((r = g('인게임', '인게임 인트로·엔딩'))) {
    const p = vpart(r, '스파인');
    add('인게임', { id: 'intro', kind: 'select', label: r[1], src: r, options: [['없음', 0], ['있음', vnum(r[2])]].concat(p ? [['동일 배경에 스파인만 변경', vtail(p)]] : []) });
  }
  if ((r = g('인게임', '인게임 캐릭터'))) {
    const p = vpart(r, '추가');
    if (p) add('인게임', { id: 'chars', kind: 'per', label: '캐릭터 추가 (기본 2종 외, 단순 엑스트라 제외)', unit: '종', per: vper(p), v: vtail(p), src: r, rule: p });
  }
  // 보상
  if ((r = g('보상', '테마 + 스티커바 1종'))) {
    add('보상', { id: 'theme', kind: 'count', label: '테마 + 스티커바', unit: '종', v: vnum(r[2]), src: r, def: 1 });
    const p1 = vpart(r, '1.5배'), p2 = vpart(r, '2배 이상');
    add('보상', { id: 'bg', kind: 'select', label: '배경 크기', src: r, options: [['기본', 0]].concat(p1 ? [['1.5배', vtail(p1)]] : [], p2 ? [['2배 이상', vtail(p2)]] : []) });
  }
  // 콘선화
  const forms = VOL.rows.filter((x) => x[0] === '콘선화');
  if (forms.length) add('콘선화', { id: 'form', kind: 'select', label: '형식', src: forms[0], options: forms.map((x) => [x[1], vnum(x[2])]) });
  // 홈·스플래시
  VOL.rows.filter((x) => x[0] === '홈·스플래시').forEach((x, i) => add('홈·스플래시', { id: 'home' + i, kind: 'fixed', label: x[1], v: vnum(x[2]), src: x }));
  // 홍보물: 합계 줄을 뺀 항목을 각각 고름
  VOL.rows.filter((x) => x[0] === '홍보물' && x[1] !== '합계').forEach((x, i) => add('홍보물', { id: 'promo' + i, kind: 'check', label: x[1], v: vnum(x[2]), src: x, def: true }));
  // 기타
  VOL.rows.filter((x) => x[0] === '기타').forEach((x, i) => {
    const base = vbase(x[1]);
    if (base > 1) add('기타', { id: 'etc' + i, kind: 'ratio', label: x[1].replace(/\s*\(.*\)/, ''), unit: /장/.test(x[1]) ? '장' : '개', base, v: vnum(x[2]), src: x });
    else add('기타', { id: 'etc' + i, kind: 'count', label: x[1].replace(/\s*1개당/, ''), unit: '개', v: vnum(x[2]), src: x });
  });
  // 공통 배수 (모든 단위)
  const mult = VOL.rows.find((x) => x[0] === '공통' && /×/.test(x[2] || ''));
  return { cats: Object.keys(M2), fields: M2, mult: mult ? { label: mult[1], v: vnum(mult[2]), note: mult[3], src: mult } : null };
}
function volumeConv() {
  const r = VOL.rows.find((x) => x[0] === '환산');
  const dayPerVol = r ? vnum(r[2]) / vnum(r[1]) : 5;
  const hp = r && r[3] ? r[3].match(/1시간\s*=\s*(\d+(?:\.\d+)?)일/) : null;
  return { dayPerVol, dayPerHour: hp ? parseFloat(hp[1]) : null, row: r };
}

function volumeCalc(model, cat, state) {
  const lines = [];
  let total = 0;
  (model.fields[cat] || []).forEach((f) => {
    const s = state[f.id];
    let v = 0, text = '';
    if (f.kind === 'fixed') { v = f.v; text = '기본 포함'; }
    else if (f.kind === 'check') { v = s ? f.v : 0; text = s ? '포함' : ''; }
    else if (f.kind === 'count') { const n = +s || 0; v = n * f.v; text = n ? `${n}${f.unit} × ${f.v}` : ''; }
    else if (f.kind === 'per') { const n = +s || 0; const k = Math.floor(n / f.per); v = k * f.v; text = n ? `${n}${f.unit} → ${f.per}${f.unit}마다 ${f.v} × ${k}` : ''; }
    else if (f.kind === 'ratio') { const n = +s || 0; v = (n / f.base) * f.v; text = n ? `${n}${f.unit} ÷ ${f.base} × ${f.v}` : ''; }
    else if (f.kind === 'select') { const o = f.options[+s || 0]; v = o ? o[1] : 0; text = o && o[1] ? o[0] : ''; }
    if (v) lines.push([f.label, text, v]);
    total += v;
  });
  if (model.mult && state.__mult) { lines.push([model.mult.label, `합계 × ${model.mult.v}`, total * (model.mult.v - 1)]); total *= model.mult.v; }
  return { total: r2(total), lines };
}

function initVolume() {
  VOL.rows = (DATA.volume || []).slice(1).map((r) => r.map((c) => (c || '').trim()));
  const box = $('#volCalc');
  if (!VOL.rows.length) { box.innerHTML = '<p class="v-note">표에 ‘볼륨 기준’ 시트가 없습니다.</p>'; return; }
  const model = volumeModel(), conv = volumeConv();
  const t01 = M && M.tasks.find((t) => t.name === '볼륨 책정 회의');
  $('#volSub').textContent = `표의 ‘볼륨 기준’ 시트로 단위 하나의 디자인 볼륨과 예상일을 계산합니다.${t01 ? ` ${t01.id} ${t01.name}에서 쓰세요.` : ''} 숫자는 모두 시트에서 가져옵니다.`;
  try { VOL.list = JSON.parse(localStorage.getItem(VOL_KEY) || '[]'); } catch (e) { VOL.list = []; }
  VOL.cat = model.cats[0];
  const state = {};
  const fieldHTML = (f) => {
    const id = `v_${f.id}`;
    const hint = f.rule ? `<small>${esc(f.rule)}</small>` : f.src && f.src[3] && f.kind !== 'select' ? `<small>${esc(f.src[3])}</small>` : '';
    if (f.kind === 'fixed') return `<div class="v-f fixed"><span class="v-l">${esc(f.label)}${hint}</span><span class="v-v">${esc(f.src ? f.src[2] : f.v)}</span></div>`;
    if (f.kind === 'check') return `<label class="v-f" for="${id}"><span class="v-l"><input type="checkbox" id="${id}" data-f="${f.id}"${state[f.id] ? ' checked' : ''}> ${esc(f.label)}${hint}</span><span class="v-v">${esc(f.src && f.src[1] === f.label ? f.src[2] : f.v)}</span></label>`;
    if (f.kind === 'select') return `<div class="v-f"><label class="v-l" for="${id}">${esc(f.label)}${f.src && f.src[3] ? `<small>${esc(f.src[3])}</small>` : ''}</label><select id="${id}" data-f="${f.id}">${f.options.map((o, i) => `<option value="${i}"${+state[f.id] === i ? ' selected' : ''}>${esc(o[0])}${o[1] ? ` (${o[1]})` : ''}</option>`).join('')}</select></div>`;
    const per = f.kind === 'per' ? `${f.per}${f.unit}마다 ${f.v}` : f.kind === 'ratio' ? `${f.base}${f.unit} 기준 ${f.v}` : `1${f.unit}당 ${f.v}`;
    return `<div class="v-f"><label class="v-l" for="${id}">${esc(f.label)}<small>${esc(per)}${f.kind !== 'per' && f.src && f.src[3] ? ' · ' + esc(f.src[3]) : ''}</small></label><span class="v-num"><input type="number" min="0" step="1" inputmode="numeric" id="${id}" data-f="${f.id}" value="${state[f.id] ?? ''}" placeholder="0"> ${esc(f.unit)}</span></div>`;
  };
  const resetState = () => {
    Object.keys(state).forEach((k) => delete state[k]);
    (model.fields[VOL.cat] || []).forEach((f) => { if (f.def !== undefined) state[f.id] = f.def; });
  };
  const render = () => {
    const res = volumeCalc(model, VOL.cat, state);
    const days = res.total * conv.dayPerVol;
    const promoSum = VOL.cat === '홍보물' ? vrow('홍보물', '합계') : null;
    box.innerHTML = `<div class="v-tabs" role="tablist" aria-label="단위 종류">${model.cats.map((c) => `<button type="button" role="tab" aria-selected="${c === VOL.cat}" data-cat="${esc(c)}">${esc(c)}</button>`).join('')}</div>
      <div class="v-fields">${(model.fields[VOL.cat] || []).map(fieldHTML).join('')}
      ${model.mult ? `<label class="v-f" for="v_mult"><span class="v-l"><input type="checkbox" id="v_mult" data-f="__mult"${state.__mult ? ' checked' : ''}> ${esc(model.mult.label)}<small>공통 · ${esc(model.mult.note || '')}</small></span><span class="v-v">×${model.mult.v}</span></label>` : ''}</div>
      <div class="v-result" aria-live="polite"><div><span class="v-big">${res.total}</span><span class="v-u">볼륨</span></div><div><span class="v-big">${r2(days)}</span><span class="v-u">일</span>${conv.dayPerHour ? `<span class="v-h">약 ${Math.round(days / conv.dayPerHour)}시간</span>` : ''}</div></div>
      ${res.lines.length ? `<ul class="v-lines">${res.lines.map(([l, t, v]) => `<li><span>${esc(l)}</span><span>${esc(t)}</span><span>+${r2(v)}</span></li>`).join('')}</ul>` : ''}
      ${promoSum ? `<p class="v-note">기준 시트의 홍보물 합계는 ${esc(promoSum[2])}입니다. 네 항목을 모두 고르면 같은 값이 됩니다.</p>` : ''}
      <div class="v-add"><input type="text" id="v_name" placeholder="${esc(VOL.cat)} 단위 이름 (예: 화장실)" aria-label="단위 이름"><button type="button" class="pill-btn" id="v_addBtn">목록에 추가</button></div>
      ${listHTML()}`;
  };
  const listHTML = () => {
    if (!VOL.list.length) return '<p class="v-note">단위를 계산해 목록에 추가하면 프로젝트 합계가 여기에 나옵니다.</p>';
    const sum = r2(VOL.list.reduce((s, x) => s + x.volume, 0));
    return `<div class="v-list"><h4>프로젝트 목록 <span class="num">${VOL.list.length}개 · ${sum} 볼륨 · ${r2(sum * conv.dayPerVol)}일</span></h4><ul>${VOL.list.map((x, i) => `<li><span>${esc(x.cat)}</span><b>${esc(x.name)}</b><span class="num">${x.volume} · ${r2(x.volume * conv.dayPerVol)}일</span><button type="button" class="v-del" data-del="${i}" aria-label="${esc(x.name)} 지우기">✕</button></li>`).join('')}</ul><button type="button" class="v-clear" id="v_clear">목록 비우기</button></div>`;
  };
  const save = () => { try { localStorage.setItem(VOL_KEY, JSON.stringify(VOL.list)); } catch (e) { /* 저장 불가 환경 */ } };
  box.addEventListener('click', (e) => {
    const tab = e.target.closest('[data-cat]');
    if (tab) { VOL.cat = tab.dataset.cat; resetState(); render(); box.querySelector(`[data-cat="${CSS.escape(VOL.cat)}"]`).focus(); return; }
    if (e.target.closest('#v_addBtn')) {
      const res = volumeCalc(model, VOL.cat, state);
      const name = $('#v_name').value.trim() || `${VOL.cat} ${VOL.list.filter((x) => x.cat === VOL.cat).length + 1}`;
      VOL.list.push({ cat: VOL.cat, name, volume: res.total });
      save(); render(); return;
    }
    const del = e.target.closest('[data-del]');
    if (del) { VOL.list.splice(+del.dataset.del, 1); save(); render(); return; }
    if (e.target.closest('#v_clear')) { VOL.list = []; save(); render(); }
  });
  box.addEventListener('input', (e) => {
    const el = e.target.closest('[data-f]');
    if (!el) return;
    state[el.dataset.f] = el.type === 'checkbox' ? el.checked : el.value;
    const focusId = el.id, pos = el.selectionStart;
    render();
    const again = document.getElementById(focusId);
    if (again) { again.focus(); try { if (pos != null) again.setSelectionRange(pos, pos); } catch (err) { /* number 입력은 커서 위치 없음 */ } }
  });
  resetState();
  render();
  renderVolumeCriteria(model, conv);
}

function renderVolumeCriteria(model, conv) {
  const cats = [];
  VOL.rows.forEach((r) => { if (!['환산', '출처'].includes(r[0]) && !cats.includes(r[0])) cats.push(r[0]); });
  const scope = VOL.rows.find((r) => r[0] === '공통' && r[1] === '포함 범위');
  const src = VOL.rows.find((r) => r[0] === '출처');
  const perRules = [];
  Object.values(model.fields).flat().forEach((f) => { if (f.kind === 'per' && !perRules.includes(f.rule)) perRules.push(f.rule); });
  $('#volCriteria').innerHTML = `<h3>볼륨 측정 기준</h3>
    <p class="v-cap">‘볼륨 기준’ 시트를 그대로 옮겼습니다. 볼륨은 디자인 결과물(화면 · 배경 · 팝업 · 데코 · 캐릭터 등) 기준으로 셉니다.</p>
    <h4>측정 순서</h4>
    <ol class="v-steps">
      <li>단위 종류를 고릅니다 (${esc(cats.filter((c) => c !== '공통').join(' · '))}).</li>
      <li>기본 볼륨에서 시작합니다. 인게임은 기본 ${esc((vrow('인게임', '기본') || [])[2] || '')}, 콘선화는 형식에 따라, 홈·스플래시는 고정값입니다.</li>
      <li>해당하는 디자인 요소를 더합니다 (+ 항목, 1종당 · 2종당 항목).</li>
      <li>일러스트형 · 실사형이면 합계에 ${esc((model.mult || {}).v ?? '')}배를 곱합니다 (${esc((model.mult || {}).note || '')}).</li>
      <li>일수로 바꿉니다: ${esc(conv.row ? `${conv.row[1]} = ${conv.row[2]}` : '')}${conv.row && conv.row[3] ? ` (${esc(conv.row[3])})` : ''}.</li>
    </ol>
    ${cats.map((c) => `<h4>${esc(c)}</h4><dl class="v-dl">${VOL.rows.filter((r) => r[0] === c).map((r) => `<dt>${esc(r[1])}</dt><dd><b>${esc(r[2] || '')}</b>${r[3] ? ` · ${esc(r[3])}` : ''}</dd>`).join('')}</dl>`).join('')}
    <h4>계산 방식 (표에 없는 부분)</h4>
    <ul class="v-rules">
      ${perRules.length ? `<li>‘2종당’처럼 묶음으로 적힌 항목은 묶음이 찰 때마다 더하고, 남는 수는 더하지 않습니다 (${esc(perRules.join(' / '))}). 표에 나머지 처리 규칙이 없어 이렇게 계산했습니다.</li>` : ''}
      <li>‘100개 기준’, ‘3장 기준’ 항목은 개수에 비례해 계산합니다.</li>
      <li>홍보물은 합계 대신 항목별로 골라 더합니다. 네 항목을 모두 고르면 시트의 합계와 같습니다.</li>
    </ul>
    ${scope ? `<p class="v-note"><b>포함 범위</b> · ${esc(scope[3])}</p>` : ''}
    ${src ? `<p class="v-src">출처: ${esc(src[1])}</p>` : ''}`;
}

/* ═════════════ 11. 일정표 기준 ═════════════ */
/* 두 가지만: 앱 종합 스케쥴표(볼륨 → 예상일), 일일 일정표(예상일 → 시간). 숫자는 볼륨 기준 시트의 환산에서 가져옴 */
function initSchedule() {
  const conv = volumeConv();
  const hoursPerDay = Math.round(1 / (conv.dayPerHour || 0.125));
  const r2s = (n) => Math.round(n * 100) / 100;
  const tn = (name) => (M && M.tasks.find((t) => t.name === name) ? name : null);
  // 예시 1: 앱 종합 스케쥴표 (가상 프로젝트, 볼륨은 볼륨 기준 시트 값으로 맞춘 가상 단위)
  const plan = [
    ['홈·스플래시', '스플래시, 홈', 0.3], ['콘선화', '콘선화 (맵 형식)', 1.0], ['인게임', '인게임 A', 0.8],
    ['인게임', '인게임 B', 1.2], ['보상', '보상', 0.4], ['홍보물', '홍보물', 0.7],
  ];
  const planTotal = r2s(plan.reduce((s, r) => s + r[2], 0));
  // 예시 2: 일일 일정표 (인게임 A의 예상일을 하루 8시간씩 나눔, 작업 이름은 워크플로우 표)
  const unitA = plan[2];
  const daysA = r2s(unitA[2] * conv.dayPerVol), hoursA = r2s(daysA * hoursPerDay);
  const daily = [
    [1, [['기획서 사전확인', 1], ['기획전달 회의', 1], ['1차 디자인', 6]]],
    [2, [['1차 디자인', 4], ['내부 컨펌', 1], ['디자인 수정', 3]]],
    [3, [['기획 컨펌', 1], ['스파인용 디자인 정리', 2], ['1차 스파인', 5]]],
    [4, [['스파인 수정', 3], ['jpg 추출', 1], ['리소스 가이드 작성', 1], ['썸네일 제작', 3]]],
  ].map(([d, items]) => [d, items.filter(([n]) => tn(n))]);
  const dailyTotal = daily.reduce((s, [, items]) => s + items.reduce((a, [, h]) => a + h, 0), 0);
  $('#schSub').textContent = '디자인 일정은 볼륨을 예상일로, 예상일을 시간으로 바꿔 씁니다. 아래 표는 이해를 돕기 위한 가상 예시입니다.';
  $('#schBody').innerHTML = `<div class="s-two">
    <article class="s-card"><p class="s-tag">1 · 앱 종합 스케쥴표</p><p class="s-big">볼륨 1 = ${r2s(conv.dayPerVol)}일</p>
      <p>볼륨을 예상일로 바꿔 씁니다. 예: 볼륨 ${unitA[2]} → 예상 ${daysA}일</p>
      <p class="s-ex-cap">예시 · 가상 프로젝트</p>
      <div class="s-tbl"><table>
        <thead><tr><th scope="col">단위 구분</th><th scope="col">단위명</th><th scope="col" class="num">디자인 볼륨</th><th scope="col" class="num">예상일 (× ${r2s(conv.dayPerVol)})</th></tr></thead>
        <tbody>${plan.map(([c, n, v]) => `<tr${n === unitA[1] ? ' class="pick"' : ''}><td>${esc(c)}</td><td>${esc(n)}</td><td class="num">${v}</td><td class="num">${r2s(v * conv.dayPerVol)}일</td></tr>`).join('')}</tbody>
        <tfoot><tr><th scope="row" colspan="2">합계</th><td class="num">${planTotal}</td><td class="num">${r2s(planTotal * conv.dayPerVol)}일</td></tr></tfoot>
      </table></div></article>
    <article class="s-card"><p class="s-tag">2 · 일일 일정표</p><p class="s-big">예상일 1일 = ${hoursPerDay}시간</p>
      <p>예상일을 시간으로 잡아 작성합니다. 예: ${esc(unitA[1])} 예상 ${daysA}일 → ${hoursA}시간</p>
      <p class="s-ex-cap">예시 · ${esc(unitA[1])}의 ${daysA}일을 하루 ${hoursPerDay}시간씩</p>
      <div class="s-tbl"><table>
        <thead><tr><th scope="col">날짜</th><th scope="col">단위</th><th scope="col">작업 (워크플로우)</th><th scope="col" class="num">시간</th></tr></thead>
        <tbody>${daily.map(([d, items]) => items.map(([n, h], i) => `<tr${i === 0 ? ' class="day"' : ''}>${i === 0 ? `<th scope="row" rowspan="${items.length}">${d}일차<small>${items.reduce((a, [, x]) => a + x, 0)}시간</small></th>` : ''}<td>${esc(unitA[1])}</td><td>${esc(n)}</td><td class="num">${h}</td></tr>`).join('')).join('')}</tbody>
        <tfoot><tr><th scope="row" colspan="3">합계</th><td class="num">${dailyTotal}시간 = ${r2s(dailyTotal / hoursPerDay)}일</td></tr></tfoot>
      </table></div></article>
  </div>`;
}

/* ═════════════ 9. 조립 ═════════════ */
function sizeDiagram() {
  const ov = S.zoom === 'overview';
  S.scale = ov ? M.ovScale : innerWidth < 734 ? 0.78 : 1;
  const svg = $('#flow');
  svg.setAttribute('width', M.W * S.scale);
  svg.setAttribute('height', M.H * S.scale);
  const vh = Math.max(380, Math.min(M.H * S.scale + 14, innerHeight * 0.8));
  document.documentElement.style.setProperty('--vh', vh + 'px');
  $('#laneOv').hidden = ov;
  $('#bandOv').hidden = ov;
  if (ov) return;
  $('#laneOv').style.width = CONFIG.layout.labelW * S.scale + 'px';
  const bs = $('#bands');
  bs.setAttribute('width', M.W * S.scale);
  bs.setAttribute('height', M.headH * S.scale);
  $('#bandOv').style.height = M.headH * S.scale + 'px';
  $('#bandOv').style.setProperty('--lw', CONFIG.layout.labelW * S.scale + 'px');
  $('#laneOvIn').innerHTML = M.laneBoxes.map((b) => `<div class="lane-lab" data-role="${esc(b.role)}" style="top:${(M.rows[0].lanesTop + b.top) * S.scale}px;height:${b.h * S.scale}px"><span>${esc(b.role)}</span><small>담당 ${b.owned} · 참여 ${b.count}</small></div>`).join('');
}
/* 띠 글자: 구간이 화면 왼쪽으로 지나가도 레인 이름 오른쪽에 붙어 따라옴 */
let bandTexts = [];
function stickBandText() {
  if (!bandTexts.length) return;
  const left = $('#scroller').scrollLeft / S.scale + CONFIG.layout.labelW + 10;
  bandTexts.forEach((t) => {
    const x = Math.max(t.x0 + t.pad, Math.min(left, t.x1 - t.w - 8));
    if (x !== t.cur) { t.el.setAttribute('x', x); t.cur = x; }
  });
}
/* 그리기: 자세히 / 한눈에 를 바꿀 때마다 배치부터 다시 */
function rebuild() {
  const sc = $('#scroller');
  const ov = S.zoom === 'overview';
  layout(M, { overview: ov, availW: sc.clientWidth || 900, availH: Math.max(380, innerHeight * 0.8) - 16 });
  const out = render(M);
  sc.innerHTML = out.main;
  $('#bandOvIn').innerHTML = out.bands;
  bandTexts = ov ? [] : [...document.querySelectorAll('#bands text.bt')].map((el) => ({ el, x0: +el.dataset.x0, x1: +el.dataset.x1, pad: +el.dataset.pad, w: el.getComputedTextLength(), cur: null }));
  M.nodes.forEach((n) => { n.el = document.getElementById(`n_${n.id}_${n.tkey}`); });
  M.edges.forEach((e) => { e.el = document.getElementById(e.id); });
  sizeDiagram();
  if (S.current) applyState();
  applyFocus();
  if (ov) { sc.scrollLeft = 0; sc.scrollTop = 0; } else if (S.current) moveTo(M.nodes.get(S.current), true);
  stickBandText();
}
function setZoom(z) {
  if (S.zoom === z && M.rows) return;
  S.zoom = z;
  $('#zoomDetail').setAttribute('aria-pressed', String(z === 'detail'));
  $('#zoomOverview').setAttribute('aria-pressed', String(z === 'overview'));
  rebuild();
}

/* 카드 강조: 과정 · 역할 · 컨펌 · 반려·반복이 적힌 작업 */
const FOCUS = {
  phase: { label: (m) => `과정 ${m.phases.length}개` },
  role: { label: (m) => (S.focusRole ? `역할 · ${S.focusRole}` : `역할 ${m.roles.length}개`) },
  confirm: { label: (m) => `컨펌 ${m.tasks.filter((t) => t.tkey === 'confirm').length}개` },
  reject: { label: (m) => `반려·반복이 적힌 작업 ${m.tasks.filter((t) => t.reject).length}개` },
};
const LOOP_KINDS = new Set(['reject', 'return', 'repeat']);
function applyFocus() {
  const f = S.focus;
  const one = f === 'role' && S.focusRole ? S.focusRole : null;
  ['#flow', '#bands', '#laneOv'].forEach((sel) => {
    const el = $(sel);
    if (!el) return;
    Object.keys(FOCUS).forEach((k) => el.classList.toggle('focus-' + k, f === k));
    el.classList.toggle('one', !!one);
  });
  const dimOthers = f === 'confirm' || f === 'reject' || !!one;
  M.nodes.forEach((n) => {
    let hl = false, ring = false;
    if (f === 'confirm') hl = n.tkey === 'confirm';
    if (f === 'reject') hl = !!n.reject;
    // 역할 하나: 담당(실행)이면 채움, ● 참여만이면 윤곽
    if (one && !n.terminal) { hl = n.owner === one; ring = !hl && n.marked.includes(one); }
    const near = f === 'reject' && (n.in.some((e) => LOOP_KINDS.has(e.kind) || e.alsoReject) || n.out.some((e) => LOOP_KINDS.has(e.kind)));
    n.el.classList.toggle('hl', hl);
    n.el.classList.toggle('hl-ring', ring);
    n.el.classList.toggle('dim', dimOthers && !hl && !ring && !near);
  });
  M.edges.forEach((e) => {
    const hl = f === 'reject' && (LOOP_KINDS.has(e.kind) || !!e.alsoReject);
    e.el.classList.toggle('hl', hl);
    e.el.classList.toggle('dim', dimOthers && !hl);
  });
  document.querySelectorAll('#flow .part').forEach((p) => {
    const mine = one ? p.dataset.role === one : f === 'role';
    p.classList.toggle('hl', mine);
    p.classList.toggle('dim', dimOthers && !mine && !(f === 'confirm' && M.nodes.get(p.dataset.task).tkey === 'confirm'));
  });
  document.querySelectorAll('#flow .lane-bg, #flow .lane-t, #laneOv .lane-lab').forEach((el) => el.classList.toggle('sel', !!one && el.dataset.role === one));
  document.querySelectorAll('#stats [data-focus]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.focus === f)));
  const chip = $('#focusChip');
  chip.hidden = !f;
  if (f) chip.innerHTML = `${esc(FOCUS[f].label(M))} 강조 중 <span aria-hidden="true">✕</span><span class="sr">강조 해제</span>`;
  // 역할 고르기 줄
  const pick = $('#rolePick');
  pick.hidden = f !== 'role';
  if (f === 'role') {
    const lanes = M.laneBoxes || [];
    pick.innerHTML = `<span class="rp-label">역할 고르기</span><button type="button" data-role-pick="" aria-pressed="${!one}">전체 역할</button>` +
      lanes.map((b) => `<button type="button" data-role-pick="${esc(b.role)}" aria-pressed="${one === b.role}">${esc(b.role)} <span class="num">담당 ${b.owned} · 참여 ${b.count}</span></button>`).join('') +
      (one ? `<span class="rp-key"><i class="k-fill"></i>담당(실행) <i class="k-ring"></i>● 참여만</span>` : '');
  }
}
function setFocus(f) {
  S.focus = S.focus === f ? null : f;
  S.focusRole = null;
  if (S.focus) {
    setPlaying(false);
    setZoom('overview');
    requestAnimationFrame(() => $('#diagram').scrollIntoView({ behavior: REDUCED ? 'auto' : 'smooth', block: 'start' }));
  }
  applyFocus();
}

function mount(header, rows, sourceFile) {
  setPlaying(false);
  try {
    M = buildModel(header, rows);
    M.sourceFile = sourceFile;
    if (!M.tasks.length) throw new Error('작업 행이 없습니다.');
  } catch (err) {
    $('#scroller').innerHTML = `<p class="empty-note">${esc(err.message)}</p>`;
    return;
  }
  S.current = M.tasks[0].id;
  S.revealed = new Set(); S.teased = new Set();
  renderHero();
  rebuild();
  buildProgress();
  renderLegend();
  if (S.mode === 'guide') setMode('guide'); else select(S.current, { ripple: false, instant: true });
}

function wire() {
  const sc = $('#scroller'), vp = $('#viewport'), bubble = $('#bubble');
  // 클릭: 노드 선택 / 실루엣이면 들어오는 노드에 파동
  sc.addEventListener('click', (e) => {
    if (sc.dataset.dragged === '1') return;
    const g = e.target.closest('.node');
    if (!g) return;
    const n = M.nodes.get(g.dataset.id);
    if (g.classList.contains('is-teased')) { n.in.forEach((x) => { const src = M.nodes.get(x.from); if (visOf(src.id) === 'shown') rippleAtEl(src.el); }); return; }
    if (g.classList.contains('is-hidden')) return;
    setPlaying(false);
    select(n.id);
  });
  sc.addEventListener('keydown', (e) => {
    const g = e.target.closest && e.target.closest('.node');
    if (g && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); setPlaying(false); select(g.dataset.id); }
  });
  vp.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { e.preventDefault(); setPlaying(false); stepBy(e.key === 'ArrowRight' ? 1 : -1); }
  });
  // 말풍선
  const showBubble = (g) => {
    const n = M.nodes.get(g.dataset.id);
    if (!n || g.classList.contains('is-teased') || g.classList.contains('is-hidden')) { bubble.classList.remove('on'); return; }
    bubble.innerHTML = n.terminal ? `<b>${esc(n.name)}</b><span>끝 표시 · ${esc(n.src)}의 다음 작업</span>` : `<b>${esc(n.id)} · ${esc(n.name)}</b><span>${esc(n.owner)}${n.collab ? ' → ' + esc(n.collab) : ''}</span>`;
    const b = g.getBoundingClientRect(), v = vp.getBoundingClientRect();
    bubble.style.left = Math.max(130, Math.min(v.width - 130, b.left - v.left + b.width / 2)) + 'px';
    bubble.style.top = Math.max(60, b.top - v.top - 8) + 'px';
    bubble.classList.add('on');
  };
  sc.addEventListener('pointerover', (e) => { const g = e.target.closest('.node'); if (g) showBubble(g); });
  sc.addEventListener('pointerout', (e) => { const g = e.target.closest('.node'); if (g && !g.contains(e.relatedTarget)) bubble.classList.remove('on'); });
  sc.addEventListener('focusin', (e) => { const g = e.target.closest('.node'); if (g) showBubble(g); });
  sc.addEventListener('focusout', () => bubble.classList.remove('on'));
  // 끌어서 이동 (마우스)
  let drag = null;
  sc.addEventListener('pointerdown', (e) => {
    if (e.pointerType !== 'mouse' || e.button !== 0) return;
    drag = { x: e.clientX, y: e.clientY, l: sc.scrollLeft, t: sc.scrollTop, moved: false };
    sc.dataset.dragged = '0';
  });
  window.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!drag.moved && Math.hypot(dx, dy) > 4) { drag.moved = true; sc.classList.add('panning'); cancelAnimationFrame(camRaf); bubble.classList.remove('on'); }
    if (drag.moved) { sc.scrollLeft = drag.l - dx; sc.scrollTop = drag.t - dy; }
  });
  window.addEventListener('pointerup', () => {
    if (!drag) return;
    sc.dataset.dragged = drag.moved ? '1' : '0';
    sc.classList.remove('panning');
    drag = null;
    setTimeout(() => { sc.dataset.dragged = '0'; }, 0);
  });
  sc.addEventListener('scroll', () => {
    $('#laneOvIn').style.transform = `translateY(${-sc.scrollTop}px)`;
    $('#bandOvIn').style.transform = `translateX(${-sc.scrollLeft}px)`;
    stickBandText();
    bubble.classList.remove('on');
  }, { passive: true });
  sc.addEventListener('wheel', () => cancelAnimationFrame(camRaf), { passive: true });
  // 패널 · 점검 목록의 이동 버튼
  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-go]');
    if (!b) return;
    setPlaying(false);
    if (S.mode === 'guide' && visOf(b.dataset.go) !== 'shown') setMode('all');
    select(b.dataset.go);
  });
  // 상단: 다이어그램 (처음 작업 선택)
  $('#navStart').addEventListener('click', (e) => {
    e.preventDefault();
    setPlaying(false);
    $('#diagram').scrollIntoView({ behavior: REDUCED ? 'auto' : 'smooth', block: 'start' });
    select(M.tasks[0].id);
  });
  $('#stats').addEventListener('click', (e) => { const b = e.target.closest('[data-focus]'); if (b) setFocus(b.dataset.focus); });
  $('#zoomDetail').onclick = () => setZoom('detail');
  $('#zoomOverview').onclick = () => setZoom('overview');
  $('#focusChip').onclick = () => setFocus(S.focus);
  $('#rolePick').addEventListener('click', (e) => {
    const b = e.target.closest('[data-role-pick]');
    if (!b) return;
    S.focusRole = b.dataset.rolePick || null;
    applyFocus();
  });
  $('#modeAll').onclick = () => setMode('all');
  $('#modeGuide').onclick = () => setMode('guide');
  $('#resetBtn').onclick = resetGuide;
  $('#playBtn').onclick = () => setPlaying(!S.playing);
  $('#csvIn').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const rd = new FileReader();
    rd.onload = () => {
      const table = parseCSV(String(rd.result).replace(/^﻿/, '')).filter((r) => r.some((c) => c.trim()));
      if (table.length < 2) { $('#plabel').textContent = '불러온 CSV에 작업 행이 없습니다'; return; }
      mount(table[0].map((h) => h.trim()), table.slice(1), file.name);
      e.target.value = '';
    };
    rd.readAsText(file, 'utf-8');
  });
  let rt = 0;
  window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { placeIDots(); if (M && M.rows) rebuild(); }, 150); });
}
function parseCSV(text) {
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows;
}

const DATA = window.WORKFLOW_DATA;
buildTitle();
buildShapes();
setPlaying(false);
if (!DATA) {
  $('#scroller').innerHTML = '<p class="empty-note">workflow-data.js를 불러오지 못했습니다. site/build_data.py를 실행해 데이터 파일을 만든 뒤 다시 열어 주세요.</p>';
} else {
  wire();
  const go = () => { placeIDots(); mount(DATA.header, DATA.rows, DATA.source.file); initVolume(); initSchedule(); initPattern(); initPush(); initFollower(); };
  const timeout = new Promise((r) => setTimeout(r, 1500));
  Promise.race([document.fonts.load('600 12.5px "Pretendard Variable"').then(() => document.fonts.ready), timeout]).then(go, go);
}
</script>
